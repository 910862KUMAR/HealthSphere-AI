version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: healthsphere-postgres
    environment:
      POSTGRES_DB: healthsphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kumar9108
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: healthsphere-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/healthsphere
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: kumar9108

volumes:
  postgres_data: